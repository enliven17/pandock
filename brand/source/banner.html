<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pandock X banner</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    /* 1500×500. X lays the avatar over the lower left (about 0–320 × 360–500) and crops the edges on phones:
       the copy sits upper left, the box stays inside the middle 1300px. */
    .canvas { width: 1500px; height: 500px; background: radial-gradient(ellipse at 72% 60%, #2c2c31 0%, #131315 45%, #0b0b0c 100%); }
    .copy { position: absolute; left: 110px; top: 92px; }
    h1 { font-size: 78px; font-weight: 700; letter-spacing: -2.8px; line-height: 1.02; }
    h1 span { color: #2997ff; display: block; }
    p { margin-top: 22px; font-size: 22px; font-weight: 400; color: #a1a1a6; letter-spacing: -0.2px; }
    .stage { position: absolute; left: 930px; top: 70px; width: 380px; height: 380px; }
    .box { position: absolute; left: 60px; top: 110px; width: 260px; filter: drop-shadow(0 26px 40px rgb(0 0 0 / 0.6)); }
    .box svg { width: 100%; height: auto; display: block; }
    .chip { position: absolute; background: #f5f5f7; color: #1d1d1f; font-weight: 700; font-size: 19px; padding: 9px 17px; border-radius: 999px; box-shadow: 0 8px 22px rgb(0 0 0 / 0.45); letter-spacing: -0.2px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="copy">
      <h1>Open the box.<span>Own the market.</span></h1>
      <p>Sealed boxes of tokenized stocks on Arc · 0.10 USDC a box</p>
    </div>
    <div class="stage">
      <div class="box" id="box"></div>
      <span class="chip" style="left: 14px; top: 40px">NVDA</span>
      <span class="chip" style="left: 150px; top: 0px">TSLA</span>
      <span class="chip" style="left: 292px; top: 44px">AAPL</span>
      <span class="chip" style="left: -46px; top: 170px">AMZN</span>
      <span class="chip" style="left: 340px; top: 180px">META</span>
      <span class="chip" style="left: -18px; top: 300px">GOOGL</span>
      <span class="chip" style="left: 318px; top: 305px">SPY</span>
      <span class="chip" style="left: 150px; top: 350px">QQQ</span>
    </div>
  </div>
  <script type="module">
    import { boxSVG } from './parts.js'
    document.getElementById('box').innerHTML = boxSVG()
  </script>
</body>
</html>
